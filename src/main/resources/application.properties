spring.application.name=fish-catch-backend
server.port=${PORT:${SERVER_PORT:8080}}

# Load environment variables from backend/.env if present
spring.config.import=optional:file:.env[.properties]

# Neon PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-example-123456.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:your_neon_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP settings optimized for Neon serverless Postgres
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
